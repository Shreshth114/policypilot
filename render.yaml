services:
  - type: web
    name: policypilot
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        value: local
      - key: SEED_POLICIES
        value: "true"
      - key: STORAGE_DIR
        value: /tmp/policypilot
      - key: DATABASE_URL
        value: sqlite:////tmp/policypilot/policypilot.db
